<!DOCTYPE html>
<html lang="en" class="bg-soft env tx-3">
<head>
<meta charset="UTF-8">
<title>K2 — Intermediary's slip (R.)</title>
<!-- Player prop. Source: prototype/k2-envelope-draft.md (intermediary's note). A small scrap, handed inside K2.
     Roman = the world (R.'s written words). Print small / trim to a slip. -->
<link rel="stylesheet" href="parchment.css">
<style>
  /* a small scrap, not a full sheet — center the few lines */
  .sheet.env.slip{ min-height:297mm; display:flex; flex-direction:column; justify-content:center;
    padding:40mm 34mm; font-size:13.4pt; }
  .sheet.env.slip p{ margin:0 0 14px; }
</style>
</head>
<body>
  <div class="sheet slip">

    <p>I cannot be there. Too dangerous now.</p>

    <p>And it was never mine to keep — I was only ever to pass it on.</p>

    <p>This letter is for the head of their Council. Their chairman. Into his own hand, and no other's.</p>

    <p class="sig">Find the way. — R.</p>

  </div>
</body>
</html>
