<!DOCTYPE html>
<html lang="en" class="bg-soft tx-2">
<head>
<meta charset="UTF-8">
<title>Spice names — cut-out labels (Z5 / Z9)</title>
<!-- Shared station prop. Source: puzzles/zagadka-sensoryczna.md §Lista etykiet (10 names = 7 true + 3 distractors).
     10 cut-out name cards the players lay against the jars. Order shuffled (true/false NOT grouped) — draft line 222.
     True: rye flour, wheat flour, honey, cinnamon, cloves, ginger, nutmeg. Distractors: cardamom, pepper, buckwheat flour.
     NO edge-stamp (shared, not color-specific). Cut along the dashed guides. Style: parchment.css + scoped grid below. -->
<link rel="stylesheet" href="parchment.css">
<style>
  .sheet.labels{
    padding:18mm 16mm;
    display:flex; flex-direction:column; min-height:297mm;
  }
  .labels-head{
    text-align:center; font-style:italic; color:var(--ink-soft);
    font-size:11pt; letter-spacing:.04em; margin:0 0 10mm;
  }
  .label-grid{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-auto-rows:1fr;
    gap:0;
  }
  .label-cell{
    display:flex; align-items:center; justify-content:center;
    border:1px dashed rgba(22,17,12,.42);
    margin:-0.5px;                 /* collapse shared cut lines into single guides */
    padding:6mm 4mm;
    text-align:center;
  }
  .label-cell .nm{
    font-variant:small-caps; letter-spacing:.07em;
    font-size:20pt; color:var(--ink); line-height:1.15;
  }
</style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="sheet labels">

    <p class="labels-head">Cut along the dashed lines — one name to a card.</p>

    <div class="label-grid">
      <div class="label-cell"><span class="nm">buckwheat flour</span></div>
      <div class="label-cell"><span class="nm">cinnamon</span></div>
      <div class="label-cell"><span class="nm">honey</span></div>
      <div class="label-cell"><span class="nm">cloves</span></div>
      <div class="label-cell"><span class="nm">nutmeg</span></div>
      <div class="label-cell"><span class="nm">ginger</span></div>
      <div class="label-cell"><span class="nm">wheat flour</span></div>
      <div class="label-cell"><span class="nm">cardamom</span></div>
      <div class="label-cell"><span class="nm">rye flour</span></div>
      <div class="label-cell"><span class="nm">pepper</span></div>
    </div>

  </div>
</body>
</html>
