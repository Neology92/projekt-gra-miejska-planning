<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Szafa z szufladami i zegarem — Baj Pomorski">
  <title>Szafa z szufladami + zegar (Baj Pomorski)</title>
  <!-- korpus -->
  <rect x="12" y="8" width="40" height="48" rx="2" fill="#a86c38" stroke="#6e4824" stroke-width="2.6"/>
  <!-- linie szuflad -->
  <line x1="12" y1="24" x2="52" y2="24" stroke="#6e4824" stroke-width="2.2"/>
  <line x1="12" y1="36" x2="52" y2="36" stroke="#6e4824" stroke-width="2.2"/>
  <line x1="12" y1="46" x2="52" y2="46" stroke="#6e4824" stroke-width="2.2"/>
  <!-- uchwyty -->
  <circle cx="32" cy="30" r="1.8" fill="#5c4310"/>
  <circle cx="32" cy="41" r="1.8" fill="#5c4310"/>
  <circle cx="32" cy="51" r="1.8" fill="#5c4310"/>
  <!-- zegar w górnej szufladzie -->
  <circle cx="32" cy="16" r="5" fill="#efe0b8" stroke="#6e4824" stroke-width="2"/>
  <path d="M32 16 L32 13 M32 16 L35 17" fill="none" stroke="#5c4310" stroke-width="1.6" stroke-linecap="round"/>
</svg>
