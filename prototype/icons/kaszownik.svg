<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Brama Klasztorna z kaszownikiem — S02">
  <title>Brama z kaszownikiem (Brama Klasztorna, S02)</title>
  <!-- korpus bramy — lekki trapez (3 px zwężenie po każdej stronie ku górze) -->
  <path d="M9 57 L12 13 L52 13 L55 57 Z"
        fill="#a86c38" stroke="#6e4824" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- baza gruntu -->
  <path d="M6 57 L58 57" fill="none" stroke="#6e4824" stroke-width="2.6" stroke-linecap="round"/>
  <!-- prześwit przejazdu — dwa łuki gotyckie (szpic ogiwowy, cubic bezier) -->
  <path d="M19 57 C19 44 25 28 32 25 C39 28 45 44 45 57 Z"
        fill="#5c4310" stroke="#6e4824" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- kaszownik: machikuła nad wjazdem -->
  <path d="M16 17 L48 17 L48 24 L16 24 Z"
        fill="#efe0b8" stroke="#6e4824" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 5 wąskich otworów kaszownika -->
  <g fill="#5c4310">
    <rect x="19.5" y="18.5" width="2.5" height="4" rx="1"/>
    <rect x="24.5" y="18.5" width="2.5" height="4" rx="1"/>
    <rect x="29.5" y="18.5" width="2.5" height="4" rx="1"/>
    <rect x="34.5" y="18.5" width="2.5" height="4" rx="1"/>
    <rect x="39.5" y="18.5" width="2.5" height="4" rx="1"/>
  </g>
  <!-- archiwolta — jasny obrys wewnętrzny łuku -->
  <path d="M23 57 C23 45 28 32 32 29 C36 32 41 45 41 57"
        fill="none" stroke="#c08a52" stroke-width="2.0" stroke-linejoin="round"/>
</svg>
