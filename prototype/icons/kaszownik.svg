<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gotycka brama z ostrołukiem i kaszownikiem — Brama Klasztorna">
  <title>Kaszownik (Brama Klasztorna, ostrołuk)</title>
  <!-- korpus bramy z OSTROŁUKIEM (szczyt szpiczasty) -->
  <path d="M13 57 L13 26 L32 6 L51 26 L51 57 Z"
        fill="#a86c38" stroke="#6e4824" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- baza -->
  <path d="M10 57 L54 57" fill="none" stroke="#6e4824" stroke-width="2.6" stroke-linecap="round"/>
  <!-- przejazd ostrołukowy -->
  <path d="M23 57 L23 38 L32 27 L41 38 L41 57"
        fill="#5c4310" stroke="#6e4824" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- KASZOWNIK: wysunięta machikuła z otworami nad przejazdem, przez które lano wrzątek -->
  <path d="M22 24 L42 24 L42 18 L22 18 Z" fill="#efe0b8" stroke="#6e4824" stroke-width="2.4" stroke-linejoin="round"/>
  <g fill="#5c4310">
    <rect x="25" y="20" width="3.5" height="4" rx="1.2"/>
    <rect x="30.5" y="20" width="3.5" height="4" rx="1.2"/>
    <rect x="36" y="20" width="3.5" height="4" rx="1.2"/>
  </g>
  <!-- podświetlenie skosu ostrołuku -->
  <path d="M16 25 L31 9" fill="none" stroke="#c08a52" stroke-width="2.3" stroke-linecap="round"/>
</svg>
