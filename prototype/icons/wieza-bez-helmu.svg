<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wieża bez hełmu — Ratusz Staromiejski">
  <title>Wieża bez hełmu (Ratusz)</title>
  <!-- trzon wieży -->
  <rect x="20" y="10" width="24" height="48" fill="#a86c38" stroke="#6e4824" stroke-width="2.6"/>
  <!-- blanki (płaski szczyt — brak hełmu) -->
  <path d="M20 10 L20 5 L25 5 L25 10 M30 10 L30 5 L34 5 L34 10 M39 10 L39 5 L44 5 L44 10" fill="none" stroke="#6e4824" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- zegar -->
  <circle cx="32" cy="27" r="7" fill="#efe0b8" stroke="#6e4824" stroke-width="2.4"/>
  <circle cx="32" cy="27" r="7" fill="none" stroke="#8a6516" stroke-width="2.4" stroke-dasharray="0.1 3.2" stroke-linecap="round"/>
  <path d="M32 27 L32 22 M32 27 L36 29" fill="none" stroke="#5c4310" stroke-width="2" stroke-linecap="round"/>
  <!-- okno -->
  <rect x="28" y="42" width="8" height="11" rx="1" fill="#efe0b8" stroke="#6e4824" stroke-width="1.8"/>
</svg>
