<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Brama Mostowa">
  <title>Brama Mostowa (S01)</title>
  <!-- trzon wieży -->
  <path d="M15 58 L15 22 L49 22 L49 58 Z"
        fill="#a86c38" stroke="#6e4824" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- górna sekcja szersza (wykusz na wspornikach) -->
  <path d="M11 22 L11 13 L53 13 L53 22 Z"
        fill="#a86c38" stroke="#6e4824" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- fryz dekoracyjny pod krenelażem -->
  <path d="M12 18 L52 18" fill="none" stroke="#8a6516" stroke-width="2.2"
        stroke-dasharray="2.5 2.5" stroke-linecap="round"/>
  <!-- krenelaż: prostokątne merlony z przerwami -->
  <path d="M11 13 L11 7 L15.5 7 L15.5 10.5 L20 10.5 L20 7 L24.5 7 L24.5 10.5 L29 10.5 L29 7 L35 7 L35 10.5 L39.5 10.5 L39.5 7 L44 7 L44 10.5 L48.5 10.5 L48.5 7 L53 7 L53 13"
        fill="#a86c38" stroke="#6e4824" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- wysoki gotycki ostrołuk przejazdu -->
  <path d="M22 58 L22 36 Q22 24 32 21 Q42 24 42 36 L42 58 Z"
        fill="#efe0b8" stroke="#6e4824" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- archiwolta (jasny obrys łuku) -->
  <path d="M26 58 L26 37 Q26 28 32 26 Q38 28 38 37 L38 58"
        fill="none" stroke="#fdf3e3" stroke-width="2" stroke-linejoin="round"/>
  <!-- wąskie szczeliny okienne -->
  <rect x="17" y="30" width="2.5" height="7" rx="1" fill="#5c4310"/>
  <rect x="44.5" y="30" width="2.5" height="7" rx="1" fill="#5c4310"/>
</svg>
