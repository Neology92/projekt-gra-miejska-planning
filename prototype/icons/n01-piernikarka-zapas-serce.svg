<!-- ZAPAS / odrzucony wariant N01: toruńskie serce piernikowe.
     Zastąpiony koszem (n01-piernikarka.svg) — figura trzyma kosz pierników,
     kosz jest detalem mniej kolizyjnym niż samo serce. Zachowane na wypadek powrotu. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Piernik — toruńskie serce piernikowe">
  <title>Piernik (toruńskie serce)</title>
  <!-- ciasto piernikowe -->
  <path d="M32 57 C 14 43 6 32 6 22 C 6 14 12 9 19 9 C 25 9 30 13 32 18 C 34 13 39 9 45 9 C 52 9 58 14 58 22 C 58 32 50 43 32 57 Z"
        fill="#a86c38" stroke="#6e4824" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- delikatne podświetlenie -->
  <path d="M20 14 C 15 15 11 18 11 23" fill="none" stroke="#c08a52" stroke-width="2.4" stroke-linecap="round"/>
  <!-- lukier: kropkowana obwódka (wewnętrzne serce) -->
  <path d="M32 57 C 14 43 6 32 6 22 C 6 14 12 9 19 9 C 25 9 30 13 32 18 C 34 13 39 9 45 9 C 52 9 58 14 58 22 C 58 32 50 43 32 57 Z"
        fill="none" stroke="#fdf3e3" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="0.1 5.4" transform="translate(32 31.5) scale(0.78) translate(-32 -31.5)"/>
  <!-- lukier: zawijas w środku -->
  <path d="M22 31 q5 -7 10 0 t10 0" fill="none" stroke="#fdf3e3" stroke-width="2.3" stroke-linecap="round"/>
</svg>
