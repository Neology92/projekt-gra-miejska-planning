<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kościół halowy bez wieży z trzema sterczynami — kościół pofranciszkański NMP">
  <title>Kościół bez wieży (NMP, trzy sterczyny)</title>
  <!-- korpus halowy (prostokątna bryła ze szczytem) -->
  <path d="M12 57 L12 22 L32 9 L52 22 L52 57 Z"
        fill="#a86c38" stroke="#6e4824" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- baza -->
  <path d="M9 57 L55 57" fill="none" stroke="#6e4824" stroke-width="2.6" stroke-linecap="round"/>
  <!-- trzy małe ośmioboczne wieżyczki/sterczyny na szczycie -->
  <g fill="#efe0b8" stroke="#8a6516" stroke-width="2.2" stroke-linejoin="round">
    <path d="M16 22 L16 16 L18 13 L20 16 L20 22 Z"/>
    <path d="M30 13 L30 7 L32 4 L34 7 L34 13 Z"/>
    <path d="M44 22 L44 16 L46 13 L48 16 L48 22 Z"/>
  </g>
  <!-- ostrołukowe okno (bez wieży, akcent halowy) -->
  <path d="M27 57 L27 40 L32 33 L37 40 L37 57"
        fill="#5c4310" stroke="#6e4824" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
