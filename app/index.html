<!-- Najbanalniejszy model: jedna strona, ekrany przełączane w JS, bez routingu URL,
     bez Service Workera. Stan w localStorage (odświeżenie wraca na ekran). -->
<script>
  /* KILL stary Service Worker + cache (źródło blank-screenów ze starych wersji).
     Działa od razu, zanim cokolwiek się załaduje. */
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
  } catch (e) {}
</script>
