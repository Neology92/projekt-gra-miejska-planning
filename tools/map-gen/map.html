<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navigation Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"/>
<link rel="stylesheet" href="map.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>
<script src="map-data.js"></script>
</head>
<body>

<div id="sheet">

  <!-- ============ LEFT: map column ============ -->
  <div id="map-col">
    <div id="map-main"></div>

    <!-- Rynek inset detail — overlay near the dashed rectangle it magnifies -->
    <div id="map-inset-overlay">
      <div id="map-inset"></div>
      <div id="inset-caption">Rynek Staromiejski &middot; detail</div>
    </div>

    <!-- North arrow -->
    <svg id="north-arrow" viewBox="0 0 32 44" xmlns="http://www.w3.org/2000/svg">
      <polygon points="16,4 22,22 16,18 10,22" fill="#2a1f0e"/>
      <polygon points="16,4 10,22 16,18 22,22" fill="#c8b89a" stroke="#2a1f0e" stroke-width="0.8"/>
      <line x1="16" y1="4" x2="16" y2="32" stroke="#2a1f0e" stroke-width="1"/>
      <text x="16" y="43" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#2a1f0e" font-weight="bold">N</text>
    </svg>

    <!-- Attribution (ToS requirement) -->
    <div id="attribution"></div>
  </div>

  <!-- ============ RIGHT: rail (fill-in legend only) ============ -->
  <div id="rail">
    <div id="rail-legend">
      <div id="legend-head">
        <div id="legend-title">KEY</div>
        <div id="legend-sub">Write each place beside its mark as you find it.</div>
      </div>
      <div id="legend-rows"></div>
    </div>
  </div>

</div>

<script>
(function () {
  // --- parse URL params ---
  const params = new URLSearchParams(location.search);
  const style  = params.get('style') || 'clean';   // 'clean' | 'parchment'
  const group  = params.get('group') || 'all';     // 'all' | 'G1'..'G10'

  if (style === 'parchment') document.body.classList.add('parchment');

  // --- active codes for this view ---
  const activeCodes = (group === 'all' || !Z1_GROUPS[group])
    ? Object.keys(Z1_PLACES)
    : Z1_GROUPS[group].filter(c => Z1_PLACES[c]);

  const insetSet   = new Set(Z1_INSET_CODES);
  const mainCodes  = activeCodes.filter(c => !insetSet.has(c));
  const insetCodes = activeCodes.filter(c =>  insetSet.has(c));

  // Legend order: zone order for codes, then landmarks
  const ZONE_ORDER = ['N01','N02','N03','N04','N05','N06',
                      'C01','C02','C03','C04','C06','C07','C08','C09',
                      'S01','S02','S04','W01','D01'];
  const legendCodes = ZONE_ORDER.filter(c => activeCodes.includes(c));
  const landmarkIds = Object.keys(Z1_LANDMARKS);

  // --- readiness signal for headless render ---
  let mainTilesLoaded = false, insetTilesLoaded = false;
  window.__ready = false;
  const fallbackTimer = setTimeout(() => { window.__ready = true; }, 10000);
  function checkReady() {
    if (mainTilesLoaded && insetTilesLoaded) {
      clearTimeout(fallbackTimer);
      window.__ready = true;
    }
  }

  // --- glyph lookup (puzzle codes + landmark ids) ---
  function glyphFor(code) {
    return Z1_GLYPHS[code] || (Z1_LANDMARKS[code] && Z1_LANDMARKS[code].glyph) || '';
  }

  // --- pin builder ---
  function makePin(code) {
    const pinSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 44" width="32" height="44">
      <path d="M16,42 C10,34 4,26 4,16 A12,12 0 1,1 28,16 C28,26 22,34 16,42Z"
            fill="#faf0d8" stroke="#2a1f0e" stroke-width="1.4"/>
      <svg x="8" y="8" width="16" height="16" viewBox="0 0 32 32">${glyphFor(code)}</svg>
    </svg>`;
    return L.divIcon({
      className: 'z1-pin',
      html: pinSvg,
      iconSize:    [32, 44],
      iconAnchor:  [16, 44],
      popupAnchor: [0, -44],
    });
  }

  function addPins(map, codes, source) {
    codes.forEach(code => {
      const place = source[code];
      if (!place) return;
      L.marker(place.coords, { icon: makePin(code), interactive: false, keyboard: false })
        .addTo(map);
    });
  }

  // --- MAIN MAP ---
  const mapMain = L.map('map-main', {
    zoomControl: false, scrollWheelZoom: false, doubleClickZoom: false,
    touchZoom: false, dragging: false, keyboard: false,
    attributionControl: false, zoomSnap: 0, zoomDelta: 0, inertia: false,
  });

  L.tileLayer(TILE_URL, { detectRetina: true, maxZoom: 19, attribution: TILE_ATTR })
    .addTo(mapMain)
    .once('load', () => { mainTilesLoaded = true; checkReady(); });

  mapMain.setView(FROZEN_CENTER, FROZEN_ZOOM);

  // Inset outline rectangle on main map
  L.rectangle([Z1_INSET_SW, Z1_INSET_NE],
    { color: '#2a1f0e', weight: 1.5, fill: false, dashArray: '4,3', interactive: false })
    .addTo(mapMain);

  addPins(mapMain, mainCodes, Z1_PLACES);
  addPins(mapMain, landmarkIds, Z1_LANDMARKS);

  // --- Connector: dashed leader from the marked Rynek rectangle to the inset
  //     overlay box. Drawn in MAP coords (via the overlay's screen position) so
  //     it stays correct if FROZEN_CENTER/ZOOM change. ---
  (function drawConnector() {
    const overlay = document.getElementById('map-inset-overlay');
    const mainEl  = document.getElementById('map-main');
    if (!overlay || !mainEl) return;
    const o = overlay.getBoundingClientRect();
    const m = mainEl.getBoundingClientRect();
    const corner = L.point(o.left - m.left, o.top - m.top); // inset top-left, map px
    const cornerLatLng = mapMain.containerPointToLatLng(corner);
    const rectCenter = L.latLng((Z1_INSET_SW[0] + Z1_INSET_NE[0]) / 2,
                                (Z1_INSET_SW[1] + Z1_INSET_NE[1]) / 2);
    L.polyline([rectCenter, cornerLatLng],
      { color: '#2a1f0e', weight: 1.2, dashArray: '5,4', opacity: .8, interactive: false })
      .addTo(mapMain);
  }());

  // --- INSET MAP ---
  const mapInset = L.map('map-inset', {
    zoomControl: false, scrollWheelZoom: false, doubleClickZoom: false,
    touchZoom: false, dragging: false, keyboard: false,
    attributionControl: false, inertia: false,
  });

  L.tileLayer(TILE_URL, { detectRetina: true, maxZoom: 19, attribution: TILE_ATTR })
    .addTo(mapInset)
    .once('load', () => { insetTilesLoaded = true; checkReady(); });

  mapInset.fitBounds([Z1_INSET_SW, Z1_INSET_NE], { padding: [10, 10] });
  addPins(mapInset, insetCodes, Z1_PLACES);

  // --- LEGEND (fill-in rows: glyph = ______) ---
  (function buildLegend() {
    const host = document.getElementById('legend-rows');

    function rowFor(code, glyph) {
      const row = document.createElement('div');
      row.className = 'legend-row';

      const swatch = document.createElement('span');
      swatch.className = 'lg-swatch';
      // glyph strings come from our own static map-data.js (same trust level as makePin)
      swatch.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="26" height="26">${glyph}</svg>`;

      const eq = document.createElement('span');
      eq.className = 'lg-eq';
      eq.textContent = '=';

      const line = document.createElement('span');
      line.className = 'lg-line';

      row.appendChild(swatch);
      row.appendChild(eq);
      row.appendChild(line);
      return row;
    }

    legendCodes.forEach(code => host.appendChild(rowFor(code, glyphFor(code))));

    // Fixed landmarks — visually divided (always-present reference marks)
    if (landmarkIds.length) {
      const div = document.createElement('div');
      div.className = 'legend-divider';
      host.appendChild(div);
      landmarkIds.forEach(lid => host.appendChild(rowFor(lid, glyphFor(lid))));
    }
  }());

  // --- ATTRIBUTION (DOM construction; no innerHTML with external strings) ---
  (function buildAttribution() {
    const el = document.getElementById('attribution');
    const osm = document.createElement('a');
    osm.href = 'https://www.openstreetmap.org/copyright';
    osm.textContent = 'OpenStreetMap';
    const carto = document.createElement('a');
    carto.href = 'https://carto.com/attributions';
    carto.textContent = 'CARTO';
    el.appendChild(document.createTextNode('© '));
    el.appendChild(osm);
    el.appendChild(document.createTextNode(' contributors · © '));
    el.appendChild(carto);
  }());

})();
</script>
</body>
</html>
