<!DOCTYPE html>
<html lang="en" class="tx-9">
<head>
<meta charset="utf-8">
<title>Z11 — Table 1: The Order's Sign</title>

<!-- Reuse parchment.css (fonts load relative to it, from prototype/print/src/fonts/) -->
<link rel="stylesheet" href="../../prototype/print/src/parchment.css">

<style>
  /* Force exactly one A4 page */
  html, body { height: 297mm; overflow: hidden; }

  .sheet.t1 {
    padding: 14mm 20mm 12mm;
    height: 296mm;
    min-height: 0;
    overflow: hidden;
  }

  /* Header */
  .t1-head { text-align: center; margin: 0 0 4mm; }
  .t1-title {
    font-variant: small-caps;
    letter-spacing: .08em;
    font-size: 18pt;
    margin: 0 0 2mm;
  }
  .t1-rule {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 11pt;
    line-height: 1.45;
    max-width: 78%;
    margin: 0 auto;
  }

  hr.t1-sep {
    border: 0;
    height: 8px;
    width: 55%;
    margin: 3.5mm auto;
    background: var(--pen-rule) center / 100% 8px no-repeat;
  }

  /* Grid wrapper: centred, fixed width */
  .t1-grid-wrap {
    display: flex;
    justify-content: center;
  }

  /* The lookup table */
  .t1-grid {
    border-collapse: collapse;
    font-family: var(--prose);
    color: var(--ink);
  }

  /* Column header cells (object icons) */
  .t1-grid th.col-icon {
    padding: 2mm 2.5mm 1.5mm;
    text-align: center;
    vertical-align: bottom;
    border-bottom: 1.5px solid var(--ink-soft);
    width: 24mm;
  }
  .t1-grid th.col-icon svg,
  .t1-grid th.col-icon img {
    width: 20mm;
    height: 20mm;
    display: block;
    margin: 0 auto;
  }
  /* Label below icon (English word, italic, small) */
  .col-icon-label {
    font-size: 8pt;
    font-style: italic;
    color: var(--ink-soft);
    margin-top: 1mm;
    text-align: center;
  }

  /* Empty top-left corner cell */
  .t1-grid th.corner {
    width: 20mm;
    border-bottom: 1.5px solid var(--ink-soft);
  }

  /* Row header cells (colour label + swatch) */
  .t1-grid td.row-color {
    padding: 1.5mm 3mm 1.5mm 1mm;
    vertical-align: middle;
    border-right: 1.5px solid var(--ink-soft);
    white-space: nowrap;
  }
  .color-row-inner {
    display: flex;
    align-items: center;
    gap: 2mm;
  }
  .color-swatch {
    width: 5mm;
    height: 5mm;
    border-radius: 1px;
    border: 1.2px solid var(--ink-soft);
    flex-shrink: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .color-label {
    font-variant: small-caps;
    font-size: 11pt;
    letter-spacing: .04em;
  }

  /* Symbol cells */
  .t1-grid td.sym-cell {
    text-align: center;
    vertical-align: middle;
    padding: 1.5mm;
    border: 1px solid rgba(59,48,36,.25);
    width: 24mm;
    height: 22mm;
  }
  .t1-grid td.sym-cell svg {
    width: 17mm;
    height: 17mm;
    display: block;
    margin: 0 auto;
  }

  /* Validation banner (hidden when OK) */
  #val-banner {
    display: none;
    text-align: center;
    font-size: 10pt;
    color: #7a1010;
    margin-top: 4mm;
  }
  #val-banner.fail { display: block; }
  #val-banner.pass { display: block; color: #2f6d3a; }
</style>
</head>
<body>
<div class="page-bg"></div>
<!-- Edge-stamp: __STAMP__ substituted by render-z11.ps1 per group (k05-<kolor>, krzyzacy envelope 5 = Z11 finał). -->
<div class="edge-stamp">__STAMP__</div>
<div class="sheet t1" id="sheet"></div>
<div id="val-banner"></div>

<script src="cipher-data.js"></script>
<script>
(function () {
  // Run validation; show banner
  const valid = Z11_DATA.runValidation(false);
  const banner = document.getElementById('val-banner');
  if (valid) {
    banner.className = 'pass';
    banner.textContent = '✓ Validation passed (round-trip, permutations, no decoy collision)';
  } else {
    banner.className = 'fail';
    banner.textContent = '✗ VALIDATION FAILED — see browser console for details';
    Z11_DATA.runValidation(true); // re-run with console output
  }

  const { SYMBOLS, T1_ROWS, T1_COLS, COL_ICONS, makeGmerkSvg } = Z11_DATA;

  // Build column headers
  let headerRow = '<tr><th class="corner"></th>';
  T1_COLS.forEach(col => {
    headerRow += `<th class="col-icon">`
               +   (COL_ICONS[col] || `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="20">?</text></svg>`)
               +   `<div class="col-icon-label">${col}</div>`
               + `</th>`;
  });
  headerRow += '</tr>';

  // Build data rows (4 rows × 4 cols)
  const NCOL = T1_COLS.length;
  let dataRows = '';
  T1_ROWS.forEach((row, ri) => {
    dataRows += '<tr>';
    // Row header: colour label + swatch
    dataRows += `<td class="row-color">`
              +   `<div class="color-row-inner">`
              +     `<div class="color-swatch" style="background:${row.hex}"></div>`
              +     `<span class="color-label">${row.id}</span>`
              +   `</div>`
              + `</td>`;
    // symbol cells — KEY cell (Brown×Ladle) is NOT visually marked, same style as others
    for (let ci = 0; ci < NCOL; ci++) {
      const sym = SYMBOLS[ri * NCOL + ci];
      dataRows += `<td class="sym-cell">${makeGmerkSvg(sym.idx, 64)}</td>`;
    }
    dataRows += '</tr>';
  });

  document.getElementById('sheet').innerHTML =
      '<div class="t1-head">'
    +   '<div class="t1-title">The Order\'s Sign</div>'
    +   '<div class="t1-rule">A colour and a thing — both belonging to the one you will meet. '
    +     'Where they cross, you will find your sign.</div>'
    + '</div>'
    + '<hr class="t1-sep">'
    + '<div class="t1-grid-wrap">'
    +   `<table class="t1-grid"><thead>${headerRow}</thead><tbody>${dataRows}</tbody></table>`
    + '</div>';
})();
</script>
</body>
</html>
