name: Deploy aplikacja gry → Netlify (osobna strona)

# OSOBNA strona Netlify dla aplikacji gry hybrydowej (app/), niezależna od
# galerii materiałów (public/ → torun-1454-materialy). Push na master dotykający
# app/** → deploy app/ na stronę „torun-1454-gra".
#
# Idempotentny i odporny:
#  - cel deployu = STABILNY UUID strony (rename nie zmienia UUID → brak tworzenia
#    nowych losowych stron przy kolejnych pushach),
#  - jednorazowy bootstrap: pierwsza strona powstała z losową nazwą
#    (lucent-brioche-236d86) — przy pierwszym przebiegu zmieniamy jej nazwę na
#    torun-1454-gra; potem znajdujemy ją już po nazwie.
# Reużywa istniejącego sekretu NETLIFY_AUTH_TOKEN (ten sam zespół).

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app-netlify.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rozwiąż UUID strony (rename bootstrapu) + wyślij app/
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          SITE_NAME=torun-1454-gra
          BOOTSTRAP=lucent-brioche-236d86   # losowa nazwa z 1. deployu (przed renamem)
          CLI="npx --yes netlify-cli@26"

          # UUID jest stabilny mimo zmiany nazwy → szukamy po nazwie docelowej LUB
          # bootstrapowej (getSite po slug zwraca 404; listSites jest wiarygodne).
          echo "Szukam strony ($SITE_NAME / $BOOTSTRAP) w listSites…"
          ID=$($CLI api listSites --data '{}' \
            | jq -r ".[] | select(.name==\"$SITE_NAME\" or .name==\"$BOOTSTRAP\") | .id" | head -1 || true)

          if [ -z "${ID:-}" ] || [ "$ID" = "null" ]; then
            echo "::error::Nie znaleziono strony ($SITE_NAME / $BOOTSTRAP)."; exit 1
          fi
          echo "Site UUID: $ID"

          # ustaw docelową nazwę (idempotentnie; best-effort). UWAGA: netlify CLI `api`
          # oczekuje treści żądania pod kluczem "body" (name na top-level jest ignorowane).
          $CLI api updateSite --data "{\"site_id\":\"$ID\",\"body\":{\"name\":\"$SITE_NAME\"}}" \
            || echo "rename pominięty"

          # deploy po UUID (stabilny mimo nazwy); --no-build pomija build galerii
          $CLI deploy --prod --dir app --site "$ID" --no-build --message "CI ${{ github.sha }}"
